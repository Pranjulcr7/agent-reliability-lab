[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Fault injection, recovery, idempotent writes and budgets for tool-using agents on a fictional incident-response simulator."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Pranjul Gupta" }]
dependencies = [
  "smolagents==1.26.0",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
viewer = ["gradio>=5,<7"]
report = ["matplotlib>=3.8"]
local-llm = ["smolagents[transformers]==1.26.0"]
openai-compatible = ["smolagents[openai]==1.26.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arlab = "arlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arlab"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
