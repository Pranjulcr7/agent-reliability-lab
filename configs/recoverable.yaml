# Config C: B + idempotency keys on writes + SQLite checkpoints with resume.
name: recoverable
validate: true
max_retries: 2
backoff_ms: 200
idempotency: true
checkpoint: true
loop_guard: true
label_untrusted: true
max_steps: 20
max_tool_calls: 30
max_model_requests: 25
max_tokens: 150000
max_wall_ms: 120000
