name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # Deterministic smoke run: scripted policy only, no secrets, no model calls.
      - run: uv run arlab run --split smoke --out /tmp/smoke
